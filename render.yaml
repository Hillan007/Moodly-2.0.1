services:
  - type: web
    name: moodly-backend
    env: python
    buildCommand: |
      pip install -r backend/requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT backend.moodly_api:app
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: NODE_ENV
        value: production
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: FRONTEND_URL
        value: https://moodly-2.vercel.app
      - key: SPOTIFY_CLIENT_ID
        sync: false
      - key: SPOTIFY_CLIENT_SECRET
        sync: false
      - key: SPOTIFY_REDIRECT_URI_PROD
        value: https://moodly-2.vercel.app/callback
      - key: SPOTIFY_REDIRECT_URI_DEV
        value: http://localhost:3000/callback
      - key: OPENAI_API_KEY
        sync: false
      - key: VITE_SUPABASE_URL
        sync: false
      - key: VITE_SUPABASE_ANON_KEY
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
